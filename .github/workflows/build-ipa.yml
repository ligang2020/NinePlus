name: Build IPA

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: Git ref to build
        required: false
        default: v1.2.58
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ipa:
    name: Archive iOS app
    runs-on: macos-latest
    env:
      PROJECT_PATH: mini-ninebot/mini-ninebot.xcodeproj
      SCHEME: mini-ninebot
      CONFIGURATION: Release
      APP_VERSION: 1.2.58
      BUILD_NUMBER: 58
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ref || github.ref }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Detect signing mode
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.WIDGET_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$P12_PASSWORD" ] && [ -n "$APP_PROFILE_BASE64" ] && [ -n "$WIDGET_PROFILE_BASE64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Building signed IPA."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets are missing; building an unsigned IPA artifact."
          fi

      - name: Install signing assets
        if: steps.signing.outputs.signed == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.WIDGET_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-temporary-ci-keychain}"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/signing-certificate.p12"
          APP_PROFILE_PATH="$RUNNER_TEMP/app.mobileprovision"
          WIDGET_PROFILE_PATH="$RUNNER_TEMP/widget.mobileprovision"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$APP_PROFILE_BASE64" | base64 --decode > "$APP_PROFILE_PATH"
          echo -n "$WIDGET_PROFILE_BASE64" | base64 --decode > "$WIDGET_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          for profile in "$APP_PROFILE_PATH" "$WIDGET_PROFILE_PATH"; do
            plist="$profile.plist"
            security cms -D -i "$profile" > "$plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$plist")
            cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          done

      - name: Archive signed app
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/NineBotPlus.xcarchive"
          xcodebuild clean archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export signed IPA
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/NineBotPlus.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/ipa-export"
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p "$EXPORT_PATH"
          /usr/libexec/PlistBuddy -c 'Clear dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :method string ad-hoc' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string automatic' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :stripSwiftSymbols bool true' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :compileBitcode bool false' "$EXPORT_OPTIONS"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

      - name: Build unsigned IPA
        if: steps.signing.outputs.signed != 'true'
        run: |
          DERIVED_DATA="$RUNNER_TEMP/unsigned-build"
          EXPORT_PATH="$RUNNER_TEMP/ipa-export"
          xcodebuild clean build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

          APP_PATH=$(find "$DERIVED_DATA/Build/Products/${CONFIGURATION}-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app product found."
            exit 1
          fi

          rm -rf "$EXPORT_PATH"
          mkdir -p "$EXPORT_PATH/Payload"
          cp -R "$APP_PATH" "$EXPORT_PATH/Payload/"
          cd "$EXPORT_PATH"
          /usr/bin/zip -qry "NineBotPlus-v${APP_VERSION}-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NineBotPlus-v1.2.58
          path: ${{ runner.temp }}/ipa-export/*.ipa
          if-no-files-found: error
