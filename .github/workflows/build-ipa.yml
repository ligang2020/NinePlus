name: Build and publish IPA

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Upload the IPA to a GitHub Release
        required: false
        default: true
        type: boolean
      release_tag:
        description: "Release tag (must match the app version; default: v17)"
        required: false
        default: v17
  push:
    branches: [main, master]
    tags: ['v*']

# Lets the workflow create or update the GitHub Release that contains the IPA.
permissions:
  contents: write

jobs:
  build-ipa:
    name: Build unsigned iOS IPA
    # Pin the hosted image's Xcode version so the synchronized Xcode project
    # format and the iOS 18 SDK stay reproducible across runs.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Xcode and release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version

          PROJECT=mini-ninebot/mini-ninebot.xcodeproj/project.pbxproj
          VERSION="$(awk -F ' = ' '/MARKETING_VERSION = / { gsub(/;/, "", $2); print $2; exit }' "$PROJECT")"
          BUILD="$(awk -F ' = ' '/CURRENT_PROJECT_VERSION = / { gsub(/;/, "", $2); print $2; exit }' "$PROJECT")"
          test -n "$VERSION"
          test -n "$BUILD"

          TAG_NAME="v${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$TAG_NAME"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Building unsigned NinePlus IPA $TAG_NAME (build $BUILD)."

      - name: Build and package unsigned IPA
        id: package
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/NinePlusIPA
          DERIVED_DATA: ${{ runner.temp }}/NinePlusDerivedData
        shell: bash
        run: |
          set -euo pipefail
          IPA_PATH="$(scripts/package-unsigned-ipa.sh --output "$ARTIFACT_DIR" --derived-data "$DERIVED_DATA")"
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$IPA_PATH.sha256" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$(basename "$IPA_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ipa_name }}
          path: |
            ${{ steps.package.outputs.ipa_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Resolve GitHub Release target
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EXPECTED_TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$PUBLISH_RELEASE" == true ]]; then
            if [[ -n "$REQUESTED_TAG" ]]; then
              test "$REQUESTED_TAG" = "$EXPECTED_TAG"
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload IPA to GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          # `contents: write` above grants the workflow's built-in token permission
          # to create or update the release.  This must not silently skip publication
          # when an optional repository secret is absent.
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$IPA_PATH" "$CHECKSUM_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$IPA_PATH" "$CHECKSUM_PATH" \
              --target "$GITHUB_SHA" \
              --title "NinePlus LiveRide $TAG_NAME" \
              --notes "Unsigned NinePlus IPA for $TAG_NAME, built by GitHub Actions from $GITHUB_SHA."
          fi
