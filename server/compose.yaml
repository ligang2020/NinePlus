services:
  nineplus:
    build: .
    container_name: nineplus
    restart: unless-stopped
    network_mode: host
    environment:
      NINEPLUS_SESSION_ROOT: /run/nineplus/sessions
      NINEPLUS_SESSION_TTL: "2592000"
      NINEPLUS_CLI_TIMEOUT: "45"
      NINEPLUS_COOKIE_SECURE: "auto"
    tmpfs:
      - /run/nineplus:mode=700,size=64m
